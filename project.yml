name: Handla
options:
  developmentLanguage: sv
  postGenCommand: python3 scripts/fix-xcode-capabilities.py
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: se.groceriesros.handla
    DEVELOPMENT_TEAM: P92GB9QRA5
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: '1'
    INVITE_HOST: groceries-ros.web.app
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
targets:
  Handla:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
        com.apple.AssociatedDomains:
          enabled: 1
    sources: [Handla]
    info:
      path: Handla/Info.plist
      properties:
        CFBundleDisplayName: Handla
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "6"
        FirebaseMessagingAutoInitEnabled: false
        FirebaseAppDelegateProxyEnabled: false
        HandlaPushEnabled: false
        UILaunchScreen: {}
        InviteHost: $(INVITE_HOST)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Handla/Handla.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ['applinks:$(INVITE_HOST)']
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
